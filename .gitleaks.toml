title = "engineering-journal"

# Keep gitleaks' default secret rules, and add project-specific rules for
# addresses that must never appear in this public repo.
[extend]
useDefault = true

[[rules]]
id = "private-or-tailscale-ipv4"
description = "Private (RFC1918) or Tailscale/CGNAT IPv4 address"
regex = '''\b(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01])|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b'''
tags = ["network"]

[[rules]]
id = "tailnet-hostname"
description = "Tailscale MagicDNS hostname"
regex = '''[a-z0-9-]+\.ts\.net\b'''
tags = ["network"]

# No allowlists on purpose. If a real false positive appears, add a narrow
# entry here (path + regex) with a comment explaining why it is safe.
